name: Corpus backfill

# Drains tools/backfill/queue.json: discovers all KIPs from the cwiki index and
# imports pending ones as stub notes (politeFetch-throttled, ~1 req/s). Queue
# checkpoints make every run resumable; failures are recorded, never bulk-retried.
# Runs entirely on GitHub's runners — nothing executes on a developer machine.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discovery + would-crawl list only (writes nothing)"
        type: boolean
        default: false
      limit:
        description: "Max KIPs to crawl this run (empty = drain all pending)"
        type: string
        default: ""
      no_threads:
        description: "Skip mailing-list thread lookups"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: corpus-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Test-then-act: never mutate the vault on a red build.
      - name: Install + test
        working-directory: viewer
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Run backfill
        run: >
          bun tools/backfill/run.ts
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.limit != '' && format('--limit {0}', inputs.limit) || '' }}
          ${{ inputs.no_threads && '--no-threads' || '' }}

      # New stubs change the corpus -> vectors must move in the same commit
      # (the semantic staleness test enforces this invariant).
      - name: Regenerate embeddings
        if: ${{ !inputs.dry_run }}
        working-directory: viewer
        run: bun run embeddings

      # Checkpoint BEFORE the quality gate. The crawl costs ~1 req/s over the
      # whole corpus (~50 min); a retrieval regression must not discard it. The
      # checkpoint stays on a review branch and never lands directly on main.
      - name: Checkpoint crawl and vectors on the automation branch
        id: checkpoint
        if: ${{ !inputs.dry_run }}
        env:
          AUTOMATION_BRANCH: automation/corpus-backfill
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$AUTOMATION_BRANCH"
          git add -A
          git commit -m "chore(backfill): import KIP stubs ($(date -u +%Y-%m-%d))"
          git push --force-with-lease origin "HEAD:refs/heads/$AUTOMATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Quality gate: golden queries must still retrieve their expected KIP now
      # that the corpus grew. Failure = no PR update, but the expensive crawl is
      # retained on the automation branch for diagnosis and recovery.
      - name: Quality gate — golden queries
        if: ${{ steps.checkpoint.outputs.changed == 'true' }}
        working-directory: viewer
        run: bun run test

      - name: Publish the human review notice
        if: ${{ steps.checkpoint.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_BRANCH: automation/corpus-backfill
          NOTICE_TITLE: "Automation review: corpus backfill is ready"
        run: |
          review_url="https://github.com/$GITHUB_REPOSITORY/compare/main...$AUTOMATION_BRANCH?expand=1"

          body=$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            'Corpus backfill changes passed the golden-query gate and are ready for human review.' \
            "Review or open the pull request: $review_url" \
            "Automation branch: \`$AUTOMATION_BRANCH\`" \
            "Source run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Automation cannot approve or merge this change.')
          issue_number=$(gh issue list \
            --state open \
            --search "\"$NOTICE_TITLE\" in:title" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body "$body"
          else
            gh issue create --title "$NOTICE_TITLE" --body "$body"
          fi
